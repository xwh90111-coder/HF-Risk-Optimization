<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心力衰竭预测系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>心力衰竭风险预测</h1>
            <p>请输入以下临床指标，系统将使用机器学习模型进行分析。</p>
        </header>

        <main>
            <form id="prediction-form">
                <div class="form-grid">
                    <!-- Numerical Inputs -->
                    <div class="form-group">
                        <label for="age">年龄 (岁)</label>
                        <input type="number" id="age" name="age" placeholder="例如: 55" required>
                    </div>
                    <div class="form-group">
                        <label for="creatinine_phosphokinase">肌酸磷酸激酶 (mcg/L)</label>
                        <input type="number" id="creatinine_phosphokinase" name="creatinine_phosphokinase" placeholder="例如: 582" required>
                    </div>
                    <div class="form-group">
                        <label for="ejection_fraction">射血分数 (%)</label>
                        <input type="number" id="ejection_fraction" name="ejection_fraction" placeholder="例如: 20" required>
                    </div>
                    <div class="form-group">
                        <label for="platelets">血小板计数 (kiloplatelets/mL)</label>
                        <input type="number" id="platelets" name="platelets" placeholder="例如: 263358" required>
                    </div>
                    <div class="form-group">
                        <label for="serum_creatinine">血清肌酐 (mg/dL)</label>
                        <input type="number" step="0.01" id="serum_creatinine" name="serum_creatinine" placeholder="例如: 1.83" required>
                    </div>
                    <div class="form-group">
                        <label for="serum_sodium">血清钠 (mEq/L)</label>
                        <input type="number" id="serum_sodium" name="serum_sodium" placeholder="例如: 134" required>
                    </div>
                     <div class="form-group">
                        <label for="time">随访时间 (天)</label>
                        <input type="number" id="time" name="time" placeholder="例如: 4" required>
                    </div>

                    <!-- Categorical Inputs -->
                    <div class="form-group">
                        <label for="anaemia">是否贫血</label>
                        <select id="anaemia" name="anaemia">
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="diabetes">是否患有糖尿病</label>
                        <select id="diabetes" name="diabetes">
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="high_blood_pressure">是否患有高血压</label>
                        <select id="high_blood_pressure" name="high_blood_pressure">
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sex">性别</label>
                        <select id="sex" name="sex">
                            <option value="1">男</option>
                            <option value="0">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="smoking">是否吸烟</label>
                        <select id="smoking" name="smoking">
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                </div>

                <div class="model-selection">
                    <label for="model">选择预测模型</label>
                    <select id="model" name="model">
                        <option value="logistic">逻辑回归 (Logistic Regression)</option>
                        <option value="random_forest">随机森林 (Random Forest)</option>
                        <option value="svm">支持向量机 (SVM)</option>
                        <option value="gradient_boosting">梯度提升 (Gradient Boosting)</option>
                        <option value="knn">K近邻 (KNN)</option>
                    </select>
                </div>

                <button type="submit" id="predict-button">立即预测</button>
            </form>

            <div id="result-container" class="hidden">
                <h2>预测结果</h2>
                <div id="prediction-output"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
